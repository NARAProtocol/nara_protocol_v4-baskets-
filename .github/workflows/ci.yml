name: Baskets CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nara-baskets-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository · integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify public repository
        run: node scripts/check-repository.mjs

  contracts:
    name: contracts · format · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.3
      - name: Record dependency pins
        run: git submodule status --recursive
      - name: Format
        run: forge fmt --check
      - name: Build and enforce bytecode limits
        run: forge build --sizes
      - name: Deterministic unit and fuzz tests
        run: >-
          forge test
          --no-match-path "test/*Fork*.t.sol"
          --no-match-contract NARAImmutableBasketPositionManagerV1InvariantTest
          -vv
      - name: CI-profile invariants
        run: forge test --match-contract NARAImmutableBasketPositionManagerV1InvariantTest -vv
        env:
          FOUNDRY_PROFILE: ci

  app:
    name: app · test · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked app dependencies
        run: npm ci --prefix app
      - name: Dependency audit (High and Critical)
        run: npm audit --prefix app --audit-level=high
      - name: Builder, copy, parity, type, and production build checks
        run: npm run check --prefix app

  slither:
    name: slither (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.3
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Slither
        run: pip install slither-analyzer==0.11.3
      - name: Analyze canonical contracts
        run: >-
          slither .
          --fail-none
          --filter-paths
          "lib|test|script|src/NARAIndexFeeCollectorV1.sol|src/CategoryIndexSuiteV1.sol"

  aderyn:
    name: aderyn (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.3
      - name: Install checksummed Aderyn release
        run: |
          installer="$RUNNER_TEMP/aderyn-installer.sh"
          curl --fail --silent --show-error --location \
            https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-installer.sh \
            --output "$installer"
          echo "6c005c222681f1349caa31aa7c9d55b0fd0ae779c0faad65e8eaa6dc872f8faf  $installer" \
            | sha256sum --check
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Analyze Solidity sources
        run: |
          aderyn --version
          aderyn --src src --skip-update-check --stdout .

  fork-adapters:
    name: fork adapters (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - name: Require configured Base RPC secret
        shell: bash
        run: |
          if [ -z "$BASE_RPC_URL" ]; then
            echo "BASE_RPC_URL is required for the manual fork gate."
            exit 1
          fi
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.3
      - name: Run Base adapter fork tests
        run: |
          forge test --match-path "test/*Fork.t.sol" --fork-url "$BASE_RPC_URL" -vv
          forge test --match-path "test/AerodromeBasketAdapterV1.t.sol" --fork-url "$BASE_RPC_URL" -vv
